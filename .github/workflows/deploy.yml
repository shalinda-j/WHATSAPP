name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  test:
    name: Test Before Deploy
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Artifacts
    needs: test
    runs-on: ubuntu-latest
    outputs:
      backend-version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Generate Version
      id: version
      run: |
        VERSION=$(date +%Y.%m.%d)-${{ github.run_number }}
        echo "version=${VERSION}" >> $GITHUB_OUTPUT

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install dependencies
      run: npm install --no-audit --no-fund

    # Build BOTH backend (dist/) and client (client/dist/). The step was
    # mislabeled and ran only `build:client`, so the uploaded artifact's dist/
    # (backend) was always empty.
    - name: Build
      run: npm run build

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: whatsapp-bot-${{ steps.version.outputs.version }}
        path: |
          dist/
          client/dist/
        retention-days: 7

  # Production deployment is handled by DigitalOcean App Platform's
  # auto-deploy-on-push (push to main → DO builds from the Dockerfile and
  # rolls out). This workflow only builds + verifies artifacts. The previous
  # `deploy-production` job printed "Deploying…" and went green WITHOUT
  # deploying anything, which falsely reported a successful production deploy
  # on every push. It's intentionally omitted to avoid that false signal.
  #
  # If you move OFF DO auto-deploy, add a real deploy job here (doctl apps
  # create-deployment, scp/ssh, etc.) gated on `github.ref == 'refs/heads/main'`.
  deploy-note:
    name: Deployment Note
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Info
      run: |
        echo "Artifacts built for version ${{ needs.build.outputs.backend-version }}."
        echo "Production rollout is performed by DigitalOcean App Platform on push to main."
