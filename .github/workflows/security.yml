name: Security Scan

# Off the per-PR path entirely — this was the single biggest consumer of the
# repo's metered Actions minutes.
#
# What changed and why:
#
#  * CodeQL ran a matrix of [javascript, typescript]. Those are not two
#    analyses: CodeQL resolves both to the same `javascript-typescript`
#    extractor, so it scanned the identical file set twice and uploaded two
#    results for the same code. Now one job.
#  * It also asked for `security-extended, security-and-quality`. Those query
#    packs roughly triple analysis time, and `security-and-quality` is mostly
#    maintainability rules that duplicate ESLint. Kept security-extended for the
#    real vulnerability coverage, dropped the other.
#  * CodeQL and Trivy ran on every PR push. A deep static analysis on an
#    in-progress branch tells you nothing you can't learn once the change lands,
#    so they now run on push to main and weekly.
#  * Dependency Review only works with GitHub Advanced Security, which is not
#    available on a private repo on a personal plan. It was burning a runner to
#    fail instantly on every PR, so it is now gated on the repo being public and
#    self-skips until that is true.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0' # Sundays, 00:00 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    # Requires GitHub Advanced Security, which private repos on personal plans
    # don't have. Skipped rather than run-and-fail so it stops consuming a
    # runner; it starts working by itself if the repo ever goes public or GHAS
    # is enabled.
    if: github.event.repository.visibility == 'public'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    # CodeQL Autobuild can fail when the install path can't resolve the xlsx CDN
    # dependency on some runners. The analysis is still useful as a warning, so
    # don't let it fail the run.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        # One language, not a [javascript, typescript] matrix: CodeQL maps both
        # onto the `javascript-typescript` extractor, so the old matrix analysed
        # the same files twice for the same findings.
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

  trivy-scan:
    name: Trivy Scan
    runs-on: ubuntu-latest
    # The SARIF upload needs GitHub code scanning enabled. Without it the upload
    # fails even on a clean scan, so surface findings as a warning instead.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true
