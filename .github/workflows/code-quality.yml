name: Code Quality

# Weekly only, and one job.
#
# This workflow used to run four jobs on every push and every PR:
#   ESLint Analysis   → the same `npm run lint` ci.yml already runs
#   TypeScript Check  → the same tsc --noEmit / tsc -b ci.yml already runs
#   Prettier Check    → one command, on its own runner, with its own npm install
#   Complexity        → two eslint invocations both ending in `|| true`
#
# Four runners and four dependency installs per push, to re-run checks that had
# already passed — plus one that could not fail by construction. On a private
# repo every one of those minutes is metered. The first three now live as steps
# inside ci.yml's backend/frontend jobs; the complexity sweep is genuinely
# advisory, so it runs here once a week instead of on every push.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  complexity:
    name: Complexity Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Reports functions over the threshold as a heads-up. `|| true` because
      # this is a metric to watch, not a merge gate — the repo has known
      # high-complexity handlers that would otherwise stop the run.
      - name: Analyze complexity
        run: |
          npx eslint 'src/**/*.ts' --ext .ts --rule 'complexity: ["warn", 15]' || true
          npx eslint 'client/src/**/*.tsx' --ext .tsx --rule 'complexity: ["warn", 15]' || true
