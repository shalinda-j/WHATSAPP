name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Mondays at 6 AM

jobs:
  eslint:
    name: ESLint Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run ESLint
        uses: github/super-linter@v5
        with:
          languages: JAVASCRIPT, TYPESCRIPT
          eslint: true
          multiple-linters: false
          fail-on-error: true
          output-detail: detailed
          output-format: sarif
        continue-on-error: true

      - name: Upload ESLint results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

  typescript:
    name: TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check Backend
        run: npx tsc --noEmit

      - name: Install Frontend dependencies
        working-directory: ./client
        run: npm install --no-audit --no-fund

      - name: Type check Frontend
        working-directory: ./client
        run: npx tsc --noEmit

  prettier:
    name: Prettier Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install Prettier
        run: npm install -g prettier

      - name: Check Prettier formatting
        run: prettier --check "**/*.{js,jsx,ts,tsx,json,css,md}"

  complexity:
    name: Complexity Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install complexity tool
        run: npm install -g eslint-plugin-complexity

      - name: Analyze complexity
        run: |
          # Check for files exceeding complexity threshold
          eslint 'src/**/*.ts' --ext .ts --rule 'complexity: ["error", 15]' --quiet || true
          eslint 'client/src/**/*.tsx' --ext .tsx --rule 'complexity: ["error", 15]' --quiet || true
