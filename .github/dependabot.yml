version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    allow:
      - dependency-type: "production"
      - dependency-type: "dev"
    ignore:
      # Ignore xlsx from CDN (manual update required)
      - dependency-name: "xlsx"
      update-types: ["version-update:semver-major"]
    groups:
      dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "xlsx"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    versioning-strategy: increase
