# DigitalOcean App Platform spec.
# Apply via: doctl apps create --spec .do/app.yaml
# (or update the existing app to use Dockerfile via the DO dashboard:
#  Settings -> Components -> Source -> change to "Dockerfile")
#
# This spec tells DO to use the Dockerfile in repo root, pinning Node 20
# and sidestepping the npm lockfile-sync error from the Node buildpack.

name: whatsapp-ai-bot

services:
  - name: api
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      branch: main
      # Auto-deploy enabled. The 60s WHATSAPP_STARTUP_DELAY_MS below gives the
      # old pod time to fully disconnect its WhatsApp socket before the new pod
      # connects, preventing the 440 "replaced" conflict storm.
      deploy_on_push: true
      repo: shalinda-j/WHATSAPP
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xs
    health_check:
      http_path: /health
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: PORT
        scope: RUN_TIME
        value: "8080"
      - key: MONGODB_URI
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: JWT_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: ENCRYPTION_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: GEMINI_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: OPENAI_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: GROQ_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: OPENROUTER_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: WHATSAPP_STARTUP_DELAY_MS
        scope: RUN_TIME
        # Delay before connecting to WhatsApp on process start. Gives the
        # previous pod's graceful shutdown time to release the WhatsApp
        # socket so we don't both connect simultaneously and trigger a 440
        # conflict storm. 60s is comfortable for DO App Platform rolling
        # deploys; lower it only if you've also disabled rolling overlap.
        value: "60000"
      - key: ALLOWED_ORIGINS
        scope: RUN_TIME
        # Comma-separated list of accepted CORS origins for the admin panel.
        # Replace with your actual DO app URL.
        value: "https://lobster-app-m74la.ondigitalocean.app"
      - key: WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: SENDGRID_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: TELEGRAM_BOT_TOKEN
        scope: RUN_TIME
        type: SECRET
