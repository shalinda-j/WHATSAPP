# DigitalOcean App Platform spec.
# Apply via: doctl apps create --spec .do/app.yaml
# (or update the existing app to use Dockerfile via the DO dashboard:
#  Settings -> Components -> Source -> change to "Dockerfile")
#
# This spec tells DO to use the Dockerfile in repo root, pinning Node 20
# and sidestepping the npm lockfile-sync error from the Node buildpack.

name: whatsapp-ai-bot

services:
  - name: api
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      branch: main
      deploy_on_push: true
      repo: shalinda-j/WHATSAPP
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xs
    health_check:
      http_path: /health
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: PORT
        scope: RUN_TIME
        value: "8080"
      - key: MONGODB_URI
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: JWT_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: ENCRYPTION_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: GEMINI_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: OPENAI_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: GROQ_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: OPENROUTER_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: ALLOWED_ORIGINS
        scope: RUN_TIME
        # Comma-separated list of accepted CORS origins for the admin panel.
        # Replace with the production frontend origin once known.
        value: "https://lobster-app-m74la.ondigitalocean.app"
